<!--Kontakt formulär -->
<section class="kontakt-formular">
    <h1>Kontakta oss</h1>
    <p>Har du några frågor eller funderingar? Fyll i formuläret för att skicka ett meddelande.</p>
    <ul id="errorlist"></ul>
    <form id="kontakt-form">
        <label for="namn">Namn</label>
        <br>
        <input type="text" id="namn" name="namn">
        <br>
        <label for="epost">E-post</label>
        <br>
        <input type="email" id="epost" name="epost">
        <br>

        <label for="meddelande">Meddelande</label>
        <br>
        <textarea id="meddelande" name="meddelande"></textarea>
        <br>
        <button type="submit">Skicka meddelande</button>
    </form>
</section>
